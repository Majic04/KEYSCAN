# KeyScan — intégration continue
#   - à chaque envoi sur main : tests du moteur (règles de décision + banc d'essai OCR), sous Linux, en quelques minutes ;
#   - quand APP_VERSION (desktop.py) annonce une version pas encore publiée : en plus, construction, test et
#     publication des applications Mac (Apple Silicon) et Windows dans « Releases » (étiquette v<version>).
#     Pour publier une nouvelle version, il suffit donc de changer APP_VERSION.
name: KeyScan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  tests:
    name: Tests du moteur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Tesseract (français + anglais)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra fonts-dejavu-core fonts-freefont-ttf >/dev/null
      - name: Bibliothèques Python
        run: python -m pip install -r requirements.txt
      - name: Règles de décision
        run: python build/ci.py --note "Règles de décision" python tests/test_regles.py
      - name: Serveur (profils, import de plusieurs candidats, actions groupées)
        run: python build/ci.py --note "Serveur" python tests/test_serveur.py
      - name: Banc d'essai OCR (192 décisions)
        run: |
          python tests/make_bench.py "$RUNNER_TEMP/bench"
          python build/ci.py --note "Banc OCR Linux (192 décisions)" python tests/evaluate.py . "$RUNNER_TEMP/bench" "$RUNNER_TEMP/bench.json"
      - name: Ligne de commande
        run: python build/ci.py "Ligne de commande" python -m engine exemples/natif.pdf exemples/scan.pdf --mots "Master, TOEIC, chimie"

  release:
    name: Préparer la publication
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^APP_VERSION = "\([^"]*\)".*/\1/p' desktop.py)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          PRE=$(gh release view "v$V" -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease 2>/dev/null || echo absente)
          if [ "$PRE" = "false" ]; then
            echo "Version $V déjà publiée : rien à construire."; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # absente, ou pré-version d'une construction précédente qui n'a pas abouti : on (re)construit
            [ "$PRE" = "true" ] && gh release delete "v$V" -R "$GITHUB_REPOSITORY" --cleanup-tag -y
            echo "Version $V à publier : construction et publication."; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ranger les anciennes constructions de test
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v1.0.0-build.2 v1.0.0-build.3 v1.0.0-build.4 v1.0.0-build.5; do
            gh release delete "$t" --cleanup-tag -y 2>/dev/null && echo "supprimée : $t" || true
          done
      - name: Créer la publication (pré-version tant que les deux applications ne sont pas prêtes)
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" --prerelease \
            --title "KeyScan ${{ steps.tag.outputs.version }}" \
            --notes-file build/RELEASE_NOTES.md --target "${{ github.sha }}"

  mac:
    name: Mac (Apple Silicon)
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Modèle manuscrit déjà préparé (cache)
        id: modele
        uses: actions/cache/restore@v4
        with:
          path: build/models/trocr-fr
          key: trocr-fr-fp16-v1
          enableCrossOsArchive: true
      - name: Outils (Tesseract, dylibbundler)
        run: brew install tesseract dylibbundler
      - name: Bibliothèques Python
        run: python -m pip install -r requirements.txt -r requirements-manuscrit.txt -r requirements-desktop.txt
      - name: Tesseract autonome
        run: python build/ci.py "Mac - Tesseract" bash build/mac/bundle_tesseract.sh
      - name: Banc d'essai du moteur (précision OCR)
        env:
          TESSERACT_CMD: ${{ github.workspace }}/build/tesseract/tesseract
          TESSDATA_PREFIX: ${{ github.workspace }}/build/tesseract/tessdata
        run: |
          python build/ci.py "Mac - création du banc OCR" python tests/make_bench.py "$RUNNER_TEMP/bench"
          python build/ci.py --note "Banc OCR (192 décisions)" python tests/evaluate.py . "$RUNNER_TEMP/bench" "$RUNNER_TEMP/bench.json"
      - name: Modèle manuscrit (copie GitHub, sinon téléchargement + allègement)
        if: steps.modele.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/models
          if gh release download modele-manuscrit -R "$GITHUB_REPOSITORY" -p trocr-fr.tar -D build/dl --clobber; then
            tar -xf build/dl/trocr-fr.tar -C build/models && rm -rf build/dl && echo "Modèle repris de la copie GitHub"
          else
            python build/ci.py "Mac - modèle manuscrit" python build/prepare_model.py build/models/trocr-fr
          fi
          ls -la build/models/trocr-fr
      - name: Garder le modèle préparé (cache)
        if: steps.modele.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/models/trocr-fr
          key: trocr-fr-fp16-v1
          enableCrossOsArchive: true
      - name: Copie GitHub du modèle (une seule fois)
        if: steps.modele.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view modele-manuscrit -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tar -cf build/trocr-fr.tar -C build/models trocr-fr
            gh release create modele-manuscrit build/trocr-fr.tar -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Modèle d'écriture manuscrite (usage interne à la construction)" \
              --notes "Copie du modèle TrOCR français allégé, utilisée par la construction pour ne pas dépendre de Hugging Face. Ce n'est pas l'application : voir les autres publications."
          fi
          rm -f build/trocr-fr.tar
      - name: Banc d'essai manuscrit (vraie lecture TrOCR)
        env:
          TESSERACT_CMD: ${{ github.workspace }}/build/tesseract/tesseract
          TESSDATA_PREFIX: ${{ github.workspace }}/build/tesseract/tessdata
          KWF_HTR_MODEL: ${{ github.workspace }}/build/models/trocr-fr
        run: python build/ci.py --note "Banc manuscrit (TrOCR)" python tests/evaluate_manuscrit.py
      - name: Construction de KeyScan.app
        run: python build/ci.py "Mac - PyInstaller" python -m PyInstaller build/keyscan.spec --noconfirm --distpath dist --workpath build/work
      - name: Image disque (.dmg)
        run: python build/ci.py "Mac - DMG" bash build/mac/make_dmg.sh
      - name: Test de l'application construite
        run: python build/ci.py --note "Mac - test de l'application" python build/smoke_test.py dist/KeyScan.app/Contents/MacOS/KeyScan
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -f%z "$DMG"); echo "Taille : $((SIZE/1024/1024)) Mo"
          [ "$SIZE" -lt 2147483000 ] || { echo "Fichier trop gros pour GitHub (2 Go max)"; exit 1; }
          gh release upload "${{ needs.release.outputs.tag }}" "$DMG" --clobber

  windows:
    name: Windows
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Modèle manuscrit déjà préparé (cache)
        id: modele
        uses: actions/cache/restore@v4
        with:
          path: build/models/trocr-fr
          key: trocr-fr-fp16-v1
          enableCrossOsArchive: true
      - name: Bibliothèques Python (PyTorch version processeur, plus légère)
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-manuscrit.txt -r requirements-desktop.txt
      - name: Tesseract autonome
        timeout-minutes: 15
        run: python build/ci.py "Windows - Tesseract" pwsh -NoProfile -File build/windows/get_tesseract.ps1
      - name: Modèle manuscrit (copie GitHub, sinon téléchargement + allègement)
        if: steps.modele.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/models
          if gh release download modele-manuscrit -R "$GITHUB_REPOSITORY" -p trocr-fr.tar -D build/dl --clobber; then
            tar -xf build/dl/trocr-fr.tar -C build/models && rm -rf build/dl && echo "Modèle repris de la copie GitHub"
          else
            python build/ci.py "Windows - modèle manuscrit" python build/prepare_model.py build/models/trocr-fr
          fi
          ls -la build/models/trocr-fr
      - name: Garder le modèle préparé (cache)
        if: steps.modele.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/models/trocr-fr
          key: trocr-fr-fp16-v1
          enableCrossOsArchive: true
      - name: Construction de KeyScan.exe
        shell: bash
        run: python build/ci.py "Windows - PyInstaller" python -m PyInstaller build/keyscan.spec --noconfirm --distpath dist --workpath build/work
      - name: Test de l'application construite
        shell: bash
        run: python build/ci.py --note "Windows - test de l'application" python build/smoke_test.py dist/KeyScan/KeyScan.exe
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $V = (Select-String -Path desktop.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          python build/ci.py "Windows - Inno Setup" "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$V" build\windows\keyscan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=dist/KeyScan-Windows-Setup.exe
          SIZE=$(stat -c%s "$F"); echo "Taille : $((SIZE/1024/1024)) Mo"
          [ "$SIZE" -lt 2147483000 ] || { echo "Fichier trop gros pour GitHub (2 Go max)"; exit 1; }
          gh release upload "${{ needs.release.outputs.tag }}" "$F" --clobber

  finalize:
    name: Rendre la publication visible
    needs: [release, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Marquer comme dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --repo "${{ github.repository }}" --prerelease=false --latest
