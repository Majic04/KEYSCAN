<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KeyScan</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<!-- « ?v= » change à chaque version : l'application ne garde jamais d'anciens fichiers en mémoire -->
<link rel="stylesheet" href="/static/css/keyscan.css?v={{ v }}">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/static/logo.svg" alt="">KeyScan</div>
  <nav class="nav" aria-label="Navigation">
    <a href="#/dossiers" data-tab="dossiers">Dossiers</a>
    <a href="#/comparer" data-tab="comparer">Comparer</a>
    <a href="#/mots-cles" data-tab="mots-cles">Liste par défaut</a>
    <a href="#/reglages" data-tab="reglages">Réglages</a>
  </nav>
  <button class="who" id="avatar" data-action="who" aria-haspopup="menu"></button>
</header>
<div class="desk" id="desk">
  <aside class="rail" aria-label="Dossiers">
    <div class="rail-head">
      <label for="railSearch" class="sr">Rechercher un candidat</label>
      <input class="search" id="railSearch" placeholder="Rechercher" autocomplete="off">
      <button class="btn pen" data-action="new" title="Nouveau dossier">Nouveau</button>
    </div>
    <div class="rail-sum" id="railSum"></div>
    <div class="rail-list" id="rail"></div>
  </aside>
  <main id="view"></main>
</div>

<div class="mwrap" id="mwrap" aria-hidden="true"><div class="scrim" data-close></div><div id="modal" class="box" role="dialog" aria-modal="true"></div></div>
<div class="menu" id="menu" role="menu"></div>
<div class="lock" id="lock" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="cur-ring" aria-hidden="true"></div>

<!-- L'interface, en petits fichiers chargés dans cet ordre (ils partagent les mêmes variables) :
     utils      outils : échappement du texte, icônes, appels au serveur
     state      l'état (résultats reçus du serveur), la navigation, le dessin de la page
     pages      les pages : accueil, dossier, liste par défaut, réglages
     compare    la page « Comparer » : tous les dossiers dans un tableau, actions sur une sélection
     dialogs    les fenêtres : nouveau dossier, import de plusieurs candidats, mots-clés, preuve, menus
     actions    ce qui se passe quand on clique, tape, dépose un fichier
     lock       l'écran du code PIN et le verrouillage automatique
     cursor     le curseur (un cercle à l'encre bleue)
     start      le démarrage -->
{% for name in ["utils", "state", "pages", "compare", "dialogs", "actions", "lock", "cursor", "start"] %}
<script src="/static/js/{{ name }}.js?v={{ v }}" defer></script>
{% endfor %}
</body>
</html>
