  else if(f.id === "dkwForm"){ const i = $("#dkwInput"); const v = i.value; i.value = ""; await addDossierKeywords(v); i.focus(); }
  else if(f.id === "opForm"){
    const v = $("#opInput").value.trim(); if(!v) return;
    const ops = [...(state.settings.operators || [])]; if(!ops.includes(v)) ops.push(v);
    await saveOps(ops); $("#opInput") && $("#opInput").focus();
  }
  else if(f.id === "askForm"){ closeModal($("#askInput") ? $("#askInput").value : true); }
  else if(f.id === "newForm"){
    const name = $("#newName").value.trim(); if(!name) return;
    $("#newOk").disabled = true;
    const src = newKwSrc === "copy" ? +$("#kwCopy").value : newKwSrc;
    const r = await jpost("/api/dossiers", {name, keywords_from: src, terms: $("#newTerms").value});
    const files = newFiles; closeModal();
    dossierTab = files.length ? "docs" : "kw";
    if(files.length){
      const fd = new FormData(); files.forEach(x => fd.append("files", x)); fd.append("operator", currentOp || "");
      await api(`/api/dossiers/${r.id}/files`, {method:"POST", body:fd});
    }
    toast("Dossier créé"); await load(false); go(`#/dossier/${r.id}`);
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "newName") $("#newOk").disabled = !t.value.trim();
  if(t.type === "range"){
    let v = +t.value;
    if(t.id === "sReview" && v >= state.settings.present_thr){ v = state.settings.present_thr - 1; t.value = v; }
    if(t.id === "sPresent" && v <= state.settings.review_thr){ v = state.settings.review_thr + 1; t.value = v; }
    t.style.setProperty("--v", v); $("#" + t.id + "V").textContent = v + " %";
    saveSettings({[{sPresent:"present_thr", sReview:"review_thr", sQuality:"min_quality"}[t.id]]: v});
  }
});
document.addEventListener("paste", e => {
  if(e.target.id !== "kwInput" && e.target.id !== "dkwInput") return;
  const txt = e.clipboardData.getData("text");
  if(/[\n;,]/.test(txt)){ e.preventDefault(); (e.target.id === "kwInput" ? addKeywords : addDossierKeywords)(txt); }
});
$("#zipInput").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  closeModal();
  const fd = new FormData(); fd.append("archive", f); fd.append("operator", currentOp || "");
  toast("Import en cours…");
  const r = await api("/api/import-zip", {method:"POST", body:fd});
  toast(`${plural(r.dossiers.length,"dossier")} importé${r.dossiers.length>1?"s":""}`);
  e.target.value = ""; await load(false); go("#/dossiers");
};
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeMenu(); if($("#mwrap").classList.contains("on")) closeModal(null); }
});
["dragover","dragleave","drop"].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest("[data-drop]");
  if(!z){ if(ev !== "dragleave") e.preventDefault(); return; }
  e.preventDefault();
  z.classList.toggle("over", ev === "dragover");
  if(ev === "drop"){
    const files = [...e.dataTransfer.files];
    if(z.dataset.drop === "new"){ newFiles.push(...files); showNewFiles(); }
    else uploadTo(+z.dataset.drop, files);
  }
}));

/* ================================================================ écran de verrouillage
   Étapes : choose (qui êtes-vous ?) → pin (saisie) | setup1/setup2 (création) | change-old/new/confirm (changement) */
let L = null;                // état de l'écran : {step, owner, len, buf, first, old, cancelable, msg, err}
let profilesCache = [];
let idleMs = 30 * 60 * 1000, lastInput = Date.now();

async function boot(){
  let sess;
  try{ sess = await api("/api/session"); }catch{ return; }
  profilesCache = sess.profiles; idleMs = sess.idle_minutes * 60 * 1000;
  state.settings.operators = sess.profiles.map(p => p.name);
  if(sess.owner){ currentOp = sess.owner; await load(true); }
  else showLock({step:"choose"});
}
async function lockNow(){
  try{ await fetch("/api/lock", {method:"POST"}); }catch{}
  showLock({step:"choose"});
}
async function showLock(opts){
  closeMenu(); if($("#mwrap").classList.contains("on")) closeModal(null);
  if(opts.step === "choose" || !opts.cancelable){
    clearTimeout(pollTimer);
    $("#view").innerHTML = ""; $("#view")._html = ""; state.dossiers = []; state.keywords = [];   // rien ne reste visible derrière
  }
  try{ const sess = await (await fetch("/api/session")).json(); profilesCache = sess.profiles; state.settings.operators = sess.profiles.map(p => p.name); }catch{}
  L = {buf:"", msg:"", err:false, ...opts};
  if(L.step === "pin" && !L.len){ const pr = profilesCache.find(x => x.name === L.owner); L.len = pr && pr.pin_len; }
  drawLock();
  const el = $("#lock"); el.classList.add("on"); el.setAttribute("aria-hidden","false");
}
function hideLock(){ L = null; const el = $("#lock"); el.classList.remove("on"); el.setAttribute("aria-hidden","true"); }

const LOCK_TEXT = {
  pin:            o => ["Saisissez votre code", ""],
  setup1:         o => ["Créez votre code", "4 à 8 chiffres, demandé à chaque ouverture du profil"],
  setup2:         o => ["Confirmez votre code", ""],
  "change-old":   o => ["Code actuel", ""],
  "change-new":   o => ["Nouveau code", "4 à 8 chiffres"],
  "change-confirm": o => ["Confirmez le nouveau code", ""],
};
function drawLock(){
  const el = $("#lock");
  if(L.step === "choose"){
    el.innerHTML = `<div class="lock-in"><div class="lens big"></div><h2>Qui êtes-vous ?</h2><p class="msub">Choisissez votre profil</p>
      <div class="who-grid">${profilesCache.map(p => `<button class="who-card glass" data-pick="${esc(p.name)}">
        <span class="ava" style="${profStyle(p.name)}">${esc(initials(p.name))}</span><b>${esc(p.name)}</b>
        <small>${p.has_pin ? plural(p.dossiers, "dossier") : "Code à créer"}</small></button>`).join("")}</div></div>`;
    return;
  }
  const [title, hint] = LOCK_TEXT[L.step](L.owner);
  const fixed = (L.step === "pin" || L.step === "change-old") ? L.len : (L.step === "setup2" || L.step === "change-confirm") ? L.first.length : 0;
  const n = fixed || Math.max(4, L.buf.length);
  const back = L.cancelable ? "Annuler" : "Retour";
  const showOk = !fixed;
  el.innerHTML = `<div class="lock-in">
    <span class="ava sm" style="${profStyle(L.owner)}">${esc(initials(L.owner))}</span>
    <h2>${esc(title)}</h2><p class="msub ${L.err ? "err" : ""}">${esc(L.msg || hint || L.owner)}</p>
    <div class="dots" id="dots">${Array.from({length:n}, (_, i) => `<i class="${i < L.buf.length ? "on" : ""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k => `<button class="key" data-key="${k}">${k}</button>`).join("")}
      <button class="key txt" data-key="back">${back}</button><button class="key" data-key="0">0</button>
      ${showOk && L.buf.length >= 4 ? `<button class="key txt" data-key="ok" style="color:var(--blue)">OK</button>` : `<button class="key txt" data-key="del" aria-label="Effacer" ${L.buf ? "" : "disabled"}>${ic("del")}</button>`}</div>
    ${L.step === "pin" ? `<button class="link" data-key="forgot">Code oublié ?</button>
      <p class="forgot" id="forgot">Fermez KeyScan puis, sur cet ordinateur, lancez dans un Terminal :
      <code>${navigator.platform.startsWith("Win") ? `"%LOCALAPPDATA%\\Programs\\KeyScan\\KeyScan.exe"` : "/Applications/KeyScan.app/Contents/MacOS/KeyScan"} --reset-pin "${esc(L.owner)}"</code>
      (avec Python : <code>python app.py --reset-pin "${esc(L.owner)}"</code>). Un nouveau code sera demandé à la prochaine ouverture.</p>` : ""}
  </div>`;
}
function lockError(msg){
  L.buf = ""; L.msg = msg; L.err = true; drawLock();
  const d = $("#dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
}
async function lockKey(k){
  if(!L) return;
  if(k === "forgot"){ $("#forgot").classList.toggle("on"); return; }
  if(k === "back"){
    if(L.cancelable){ hideLock(); placeThumbs(document); return; }
    return showLock({step:"choose"});
  }
  if(k === "del"){ L.buf = L.buf.slice(0, -1); L.err = false; L.msg = ""; return drawLock(); }
  const fixed = (L.step === "pin" || L.step === "change-old") ? L.len : (L.step === "setup2" || L.step === "change-confirm") ? L.first.length : 0;
  if(k === "ok"){ if(!fixed && L.buf.length >= 4) return lockSubmit(); return; }
  if(!/^\d$/.test(k) || L.buf.length >= (fixed || 8)) return;
  L.buf += k; L.err = false; L.msg = ""; drawLock();
  if(fixed && L.buf.length === fixed) setTimeout(lockSubmit, 120);   // saisie complète : validation automatique
}
async function lockSubmit(){
  const pin = L.buf;
  const post = (url, body) => api(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), quiet:true});
  try{
    if(L.step === "pin"){ await post("/api/unlock", {owner:L.owner, pin}); return enterProfile(L.owner); }
    if(L.step === "setup1"){ L.first = pin; L.buf = ""; L.step = "setup2"; return drawLock(); }
    if(L.step === "setup2"){
      if(pin !== L.first){ L.step = "setup1"; L.first = null; return lockError("Les deux codes ne correspondent pas"); }
      await post("/api/pin/setup", {owner:L.owner, pin}); toast("Code créé"); return enterProfile(L.owner);
    }
    if(L.step === "change-old"){ L.old = pin; L.buf = ""; L.step = "change-new"; return drawLock(); }
    if(L.step === "change-new"){ L.first = pin; L.buf = ""; L.step = "change-confirm"; return drawLock(); }
    if(L.step === "change-confirm"){
      if(pin !== L.first){ L.step = "change-new"; L.first = null; return lockError("Les deux codes ne correspondent pas"); }
      await post("/api/pin/change", {old:L.old, new:pin}); hideLock(); toast("Code modifié"); return;
    }
  }catch(e){
    if(e.message === "verrouillé") return;
    if(L.step === "change-confirm"){ L.step = "change-old"; L.old = L.first = null; }   // ancien code faux : on recommence
    lockError(e.status === 403 ? (L.step === "change-old" ? "Code actuel incorrect" : "Code incorrect") : e.message);
  }
}
document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if(pick){ const pr = profilesCache.find(x => x.name === pick.dataset.pick);
    return showLock({step: pr.has_pin ? "pin" : "setup1", owner: pr.name, len: pr.pin_len, cancelable: false}); }
  const key = e.target.closest("#lock [data-key]");
  if(key) lockKey(key.dataset.key);
});
document.addEventListener("keydown", e => {
  if(!L || L.step === "choose") return;
  if(/^\d$/.test(e.key)) lockKey(e.key);
  else if(e.key === "Backspace") lockKey("del");
  else if(e.key === "Enter") lockKey("ok");
  else if(e.key === "Escape") lockKey("back");
  else return;
  e.preventDefault(); e.stopPropagation();
}, true);
/* verrouillage automatique après inactivité */
["pointerdown","keydown","wheel","touchstart","pointermove"].forEach(ev => addEventListener(ev, () => { lastInput = Date.now(); }, {passive:true}));
setInterval(() => { if(!L && currentOp && Date.now() - lastInput > idleMs) lockNow(); }, 15000);

/* ================================================================ curseur fluide (un seul cercle)
   - le cercle suit la souris avec une légère inertie, calculée à la vitesse réelle de l'écran ;
   - sur un bouton, il en épouse la forme (comme le pointeur de l'iPad) et le bouton est légèrement attiré ;
   - sur un champ texte, il devient une barre d'insertion ;
   - tout est piloté par les événements souris : aucune mesure de la page à chaque image,
     et la boucle d'animation s'arrête dès que le cercle est immobile ;
   - désactivé sur écran tactile et si les animations sont réduites. */
(function cursor(){
  if(!matchMedia("(pointer:fine)").matches || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const root = document.documentElement, ring = $("#cur-ring");
  const MORPH = ".btn,.iconbtn,.fab,.tab,.seg button,.link,.menu button,.key,.who-card";
  const TEXT = "input:not([type=range]),textarea,[contenteditable]";
  const POINT = "a,button,[data-drop],label,input[type=range],.rowc,.krow";
  const BASE = 36;
  let mx = -100, my = -100, x = -100, y = -100, w = BASE, h = BASE, rad = BASE / 2, sc = 1;
  let target = null, mode = "", rect = null, radius = 0, down = false, running = false, last = 0, seen = false;
  root.classList.add("cc");

  function measure(){
    if(!target) return;
    rect = target.getBoundingClientRect();
    radius = Math.min(parseFloat(getComputedStyle(target).borderRadius) || 12, rect.height / 2);
  }
  function release(){ if(target && mode === "morph"){ target.style.removeProperty("--tx"); target.style.removeProperty("--ty"); } }
  function setTarget(el){
    const m = el && el.closest(MORPH), t = !m && el && el.closest(TEXT), pt = !m && !t && el && el.closest(POINT);
    const next = m || t || pt || null, nmode = m ? "morph" : t ? "text" : pt ? "point" : "";
    if(next === target && nmode === mode) return;
    release(); target = next; mode = nmode; rect = null;
    if(mode === "morph"){ measure(); if(rect.width > 320){ mode = "point"; } }
    ring.className = mode;
  }
  function magnet(){
    if(mode !== "morph" || !rect) return;
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const dx = Math.max(-1, Math.min(1, (mx - cx) / (rect.width / 2))), dy = Math.max(-1, Math.min(1, (my - cy) / (rect.height / 2)));
    target.style.setProperty("--tx", (dx * 2).toFixed(1) + "px"); target.style.setProperty("--ty", (dy * 2).toFixed(1) + "px");
  }
  function kick(){ if(!running){ running = true; last = performance.now(); requestAnimationFrame(frame); } }

  addEventListener("pointermove", e => {
    if(e.pointerType !== "mouse") return;
    mx = e.clientX; my = e.clientY;
    if(!seen){ x = mx; y = my; seen = true; }
    root.classList.remove("cur-out");
    magnet(); kick();
  }, {passive:true});
  document.addEventListener("pointerover", e => { if(e.pointerType === "mouse"){ setTarget(e.target); kick(); } }, {passive:true});
  document.addEventListener("mouseleave", () => root.classList.add("cur-out"));
  addEventListener("scroll", () => { if(mode === "morph") measure(); kick(); }, {passive:true, capture:true});
  addEventListener("pointerdown", () => { down = true; kick(); });
  addEventListener("pointerup", () => { down = false; kick(); });
  // un élément survolé peut disparaître (changement de page) : on revient au cercle simple
  new MutationObserver(() => { if(target && !target.isConnected){ release(); target = null; mode = ""; ring.className = ""; kick(); } })
    .observe(document.body, {childList:true, subtree:true});

  function frame(now){
    const dt = Math.min(64, now - last) / 16.67; last = now;
    const f = a => 1 - Math.pow(1 - a, dt);
    let tx = mx, ty = my, tw = BASE, th = BASE, tr = BASE / 2, k = .42;
    if(mode === "morph" && rect){
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      const dx = Math.max(-1, Math.min(1, (mx - cx) / (rect.width / 2))), dy = Math.max(-1, Math.min(1, (my - cy) / (rect.height / 2)));
      tx = cx + dx * 2; ty = cy + dy * 2; tw = rect.width + 10; th = rect.height + 10; tr = radius + 5; k = .38;
    } else if(mode === "text"){ tw = 2; th = 22; tr = 1; k = .75; }
    else if(mode === "point"){ tw = th = 44; tr = 22; }
    const ts = down ? .86 : 1;
    x += (tx - x) * f(k); y += (ty - y) * f(k);
    w += (tw - w) * f(.32); h += (th - h) * f(.32); rad += (tr - rad) * f(.35); sc += (ts - sc) * f(.4);
    const still = Math.abs(tx - x) < .05 && Math.abs(ty - y) < .05 && Math.abs(tw - w) < .05 && Math.abs(th - h) < .05 && Math.abs(ts - sc) < .005;
    if(still){ x = tx; y = ty; w = tw; h = th; rad = tr; sc = ts; }
    ring.style.width = w.toFixed(2) + "px"; ring.style.height = h.toFixed(2) + "px"; ring.style.borderRadius = rad.toFixed(2) + "px";
    ring.style.transform = `translate3d(${(x - w / 2).toFixed(2)}px,${(y - h / 2).toFixed(2)}px,0) scale(${sc.toFixed(3)})`;
    if(still){ running = false; return; }      // immobile : la boucle s'arrête
    requestAnimationFrame(frame);
  }
})();

if(!location.hash) history.replaceState(null, "", "#/dossiers");
boot();
</script>
